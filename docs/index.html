<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IwashiScope</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.65;
    }
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 24px;
    }
    h1 { letter-spacing: .01em; }
    .subtitle {
      margin-top: -.75rem;
      font-size: 1.15rem;
    }
    .ja-name {
      color: color-mix(in srgb, CanvasText 70%, Canvas);
    }
    a { color: #0a84ff; }
    .note {
      margin-top: 32px;
      padding: 16px 18px;
      border-radius: 12px;
      background: color-mix(in srgb, CanvasText 7%, Canvas);
    }
  </style>
</head>
<body>
  <main>
    <h1>IwashiScope</h1>
    <p class="subtitle"><em>Spectral &amp; Color Measurement</em></p>
    <p class="ja-name">分光・測色ツール</p>
    <p>ArgyllCMS 3.5.0を改変したiwashiscope-spotreadを使用する、macOS用の分光・測色ツールです。</p>
    <p>IwashiScope本体はGNU AGPLバージョン3のみで公開しています。CIE標準光源データから生成したSwift適応物はGNU GPLバージョン3のみで、両ライセンスの第13条に基づいて結合しています。</p>
    <p>
      <a href="https://github.com/Yamonov/IwashiScope">ソースコード</a>
      ・
      <a href="https://github.com/Yamonov/IwashiScope/blob/main/LICENSE">AGPLv3</a>
      ・
      <a href="https://github.com/Yamonov/IwashiScope/blob/main/THIRD_PARTY_NOTICES.md">第三者著作物</a>
      ・
      <a href="https://github.com/Yamonov/IwashiScope/blob/main/PRIVACY.md">プライバシー</a>
    </p>
    <p class="note">署名・公証済みの初回バイナリは、まだ公開していません。</p>
  </main>
</body>
</html>
